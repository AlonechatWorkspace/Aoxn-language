name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # Tier 1: the fully supported platform (v0.26.1 platform matrix)
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      # the compiler itself no longer links LLVM (v0.29.0: C-emitting
      # backend); the LLVM install provides the clang driver it compiles with
      - name: Install clang (LLVM toolchain)
        shell: pwsh
        run: |
          winget install --id LLVM.LLVM --accept-source-agreements --accept-package-agreements --silent
          Add-Content $env:GITHUB_PATH "C:\Program Files\LLVM\bin"

      - name: Build
        run: cargo build

      - name: Test
        run: cargo test

      - name: Smoke test
        shell: pwsh
        run: |
          cargo run -- run examples\hello.ax
          cargo run -- run examples\strings.ax
          cargo run -- build examples\primes.ax -o primes.exe
          $count = .\primes.exe
          if ("$count" -ne "9592") { throw "primes returned $count, expected 9592" }

  # Tier 2: Linux x86_64
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Install clang
        run: |
          sudo apt-get update
          sudo apt-get install -y clang

      - name: Build
        run: cargo build

      - name: Test
        run: cargo test

      - name: Smoke test
        run: |
          cargo run -- run examples/hello.ax
          cargo run -- run examples/strings.ax
          cargo run -- build examples/primes.ax -o primes
          count=$(./primes)
          if [ "$count" != "9592" ]; then echo "primes returned $count, expected 9592"; exit 1; fi

  # Tier 2: macOS arm64 (Apple Silicon — exercises the AArch64 path)
  macos-arm64:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-${{ runner.arch }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-${{ runner.arch }}-cargo-

      - name: Build
        run: cargo build

      - name: Test
        run: cargo test

      - name: Smoke test
        run: |
          cargo run -- run examples/hello.ax
          cargo run -- run examples/strings.ax
