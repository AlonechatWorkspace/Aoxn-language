name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # Tier 1: the fully supported platform (v0.26.1 platform matrix)
  windows:
    runs-on: windows-latest
    env:
      AOXN_LLVM_DIR: "C:\\Program Files\\LLVM"
    steps:
      - uses: actions/checkout@v4

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Install LLVM
        shell: pwsh
        run: |
          winget install --id LLVM.LLVM --accept-source-agreements --accept-package-agreements --silent
          Add-Content $env:GITHUB_PATH "C:\Program Files\LLVM\bin"

      - name: Build
        run: cargo build

      - name: Test (97 end-to-end pipeline tests)
        run: cargo test

      - name: Smoke test
        shell: pwsh
        run: |
          cargo run -- run examples\hello.ax
          cargo run -- run examples\strings.ax
          cargo run -- build examples\primes.ax -o primes.exe
          $count = .\primes.exe
          if ("$count" -ne "9592") { throw "primes returned $count, expected 9592" }

  # Tier 2: Linux x86_64
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Install LLVM
        run: |
          sudo apt-get update
          sudo apt-get install -y llvm-18-dev clang-18 libclang-rt-18-dev
          # make the versioned tools discoverable for the compiler's clang lookup
          sudo ln -sf /usr/lib/llvm-18/bin/clang /usr/local/bin/clang || true

      - name: Build
        env:
          AOXN_LLVM_DIR: /usr/lib/llvm-18
        run: cargo build

      - name: Test
        env:
          AOXN_LLVM_DIR: /usr/lib/llvm-18
        run: cargo test

      - name: Smoke test
        env:
          AOXN_LLVM_DIR: /usr/lib/llvm-18
        run: |
          cargo run -- run examples/hello.ax
          cargo run -- run examples/strings.ax
          cargo run -- build examples/primes.ax -o primes
          count=$(./primes)
          if [ "$count" != "9592" ]; then echo "primes returned $count, expected 9592"; exit 1; fi

  # Tier 2: macOS (Intel runner; brew llvm is keg-only, hence AOXN_LLVM_DIR)
  macos-x86_64:
    runs-on: macos-13
    steps:
      - uses: actions/checkout@v4

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-${{ runner.arch }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-${{ runner.arch }}-cargo-

      - name: Install LLVM
        run: brew install llvm@18

      - name: Build
        env:
          AOXN_LLVM_DIR: /usr/local/opt/llvm@18
        run: cargo build

      - name: Test
        env:
          AOXN_LLVM_DIR: /usr/local/opt/llvm@18
        run: cargo test

      - name: Smoke test
        env:
          AOXN_LLVM_DIR: /usr/local/opt/llvm@18
        run: |
          cargo run -- run examples/hello.ax
          cargo run -- run examples/strings.ax

  # Tier 2: macOS arm64 (Apple Silicon — exercises the AArch64 backend path)
  macos-arm64:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-${{ runner.arch }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-${{ runner.arch }}-cargo-

      - name: Install LLVM
        run: brew install llvm@18

      - name: Build
        env:
          AOXN_LLVM_DIR: /opt/homebrew/opt/llvm@18
        run: cargo build

      - name: Test
        env:
          AOXN_LLVM_DIR: /opt/homebrew/opt/llvm@18
        run: cargo test

      - name: Smoke test
        env:
          AOXN_LLVM_DIR: /opt/homebrew/opt/llvm@18
        run: |
          cargo run -- run examples/hello.ax
          cargo run -- run examples/strings.ax
