name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # Aoxn targets Windows only (v0.30.0): one platform, one installer, one UI
  # backend. This job is the whole test matrix.
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      # the compiler itself no longer links LLVM (v0.29.0: C-emitting
      # backend); the LLVM install provides the clang driver it compiles with
      - name: Install clang (LLVM toolchain)
        shell: pwsh
        run: |
          winget install --id LLVM.LLVM --accept-source-agreements --accept-package-agreements --silent
          Add-Content $env:GITHUB_PATH "C:\Program Files\LLVM\bin"

      - name: Build
        run: cargo build

      - name: Test
        run: cargo test

      - name: Smoke test
        shell: pwsh
        run: |
          cargo run -- run examples\hello.ax
          cargo run -- run examples\strings.ax
          cargo run -- run examples\stdlib_demo.ax
          cargo run -- build examples\primes.ax -o primes.exe
          $count = .\primes.exe
          if ("$count" -ne "9592") { throw "primes returned $count, expected 9592" }

      # The shipped artifact is ONE executable: the installer stub with the
      # toolchain appended. Build it, install from it into a scratch prefix,
      # and run `aoxn doctor` plus a stdlib program with the installed binary —
      # a broken installer must fail here, not at release time.
      - name: Single-file installer (package, install, doctor, run)
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          powershell -ExecutionPolicy Bypass -File dist\package.ps1 -Output dist\ci
          $setup = (Get-ChildItem "dist\ci\*Setup.exe").FullName
          $prefix = Join-Path $env:RUNNER_TEMP "aoxn-install"
          & $setup -Console -Prefix $prefix
          if ($LASTEXITCODE -ne 0) { throw "the installer reported a failure" }
          & (Join-Path $prefix "bin\aoxn.exe") run (Join-Path $prefix "examples\hello.ax")
          if ($LASTEXITCODE -ne 0) { throw "the installed toolchain cannot run hello.ax" }
          Get-ChildItem "dist\ci\*Setup.exe" | Select-Object Name, Length

