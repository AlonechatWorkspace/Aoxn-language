name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # Tier 1: the fully supported platform (v0.26.1 platform matrix)
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      # the compiler itself no longer links LLVM (v0.29.0: C-emitting
      # backend); the LLVM install provides the clang driver it compiles with
      - name: Install clang (LLVM toolchain)
        shell: pwsh
        run: |
          winget install --id LLVM.LLVM --accept-source-agreements --accept-package-agreements --silent
          Add-Content $env:GITHUB_PATH "C:\Program Files\LLVM\bin"

      - name: Build
        run: cargo build

      - name: Test
        run: cargo test

      - name: Smoke test
        shell: pwsh
        run: |
          cargo run -- run examples\hello.ax
          cargo run -- run examples\strings.ax
          cargo run -- build examples\primes.ax -o primes.exe
          $count = .\primes.exe
          if ("$count" -ne "9592") { throw "primes returned $count, expected 9592" }

  # Tier 2: Linux x86_64
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Install clang
        run: |
          sudo apt-get update
          sudo apt-get install -y clang

      - name: Build
        run: cargo build

      - name: Test
        run: cargo test

      - name: Smoke test
        run: |
          cargo run -- run examples/hello.ax
          cargo run -- run examples/strings.ax
          cargo run -- build examples/primes.ax -o primes
          count=$(./primes)
          if [ "$count" != "9592" ]; then echo "primes returned $count, expected 9592"; exit 1; fi
      - name: UI backend (X11) links and runs
        run: |
          sudo apt-get install -y libx11-dev libxft-dev xvfb
          # The X11 backend must LINK: that is what catches a wrong extern
          # arity, which the clang-free unit tests cannot see (they stop at
          # C emission and never resolve a symbol).
          # NOTE: build the PROBE, not examples/ui_gallery.ax — the gallery
          # imports ui_win.ax, so linking it here would ask for GDI symbols.
          # The probe is the real X11 program; the gallery is covered by the
          # unit tests, which check both backends emit C.
          cargo run -- build examples/ui_probe_x11.ax -o /tmp/probe -l X11 -l Xft
          # Then open a real window on a virtual X server and close it
          # again — the same self-close contract the Windows smoke tests use.
          xvfb-run -a cargo run -- run examples/ui_probe_x11.ax -l X11 -l Xft | tee /tmp/ui_out.txt
          grep -q "ui-x11-ok" /tmp/ui_out.txt

  # Tier 2: macOS arm64 (Apple Silicon — exercises the AArch64 path)
  macos-arm64:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-${{ runner.arch }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-${{ runner.arch }}-cargo-

      - name: Build
        run: cargo build

      - name: Test
        run: cargo test

      - name: Smoke test
        run: |
          cargo run -- run examples/hello.ax
          cargo run -- run examples/strings.ax

      - name: UI backend (X11 under XQuartz) links
        run: |
          # macOS has no X11 by default; XQuartz provides it. What matters
          # on this runner is that the X11 backend COMPILES and LINKS on
          # macOS — running it needs an interactive GUI session, so the
          # self-close probe stays on the Linux job above.
          brew install xquartz
          # Build the PROBE, not examples/ui_gallery.ax: the gallery imports
          # ui_win.ax, so linking it here would ask the linker for GDI
          # symbols instead of X11 ones.
          cargo run -- build examples/ui_probe_x11.ax -o /tmp/probe_macos -l X11 -l Xft
          # XQuartz installs into /opt/X11, which is NOT on the default
          # search path, so pass it to both the compiler and the linker.
          cargo run -- build examples/ui_probe_x11.ax -o /tmp/probe_macos2             -l X11 -l Xft -L /opt/X11/lib
