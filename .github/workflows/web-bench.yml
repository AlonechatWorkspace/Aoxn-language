name: web-bench

# Coverage for the web suite (web/): build the Aoxn HTTP server, verify
# functional parity with the Node reference, and run a short reference
# benchmark. CI runners share CPUs, so benchmark numbers are trend/regression
# values, not absolutes. Windows only — Aoxn targets Windows (v0.30.0), and
# the POSIX socket/server modules are gone.

on:
  workflow_dispatch:
  push:
    paths:
      - "web/**"
      - ".github/workflows/web-bench.yml"
  pull_request:
    paths:
      - "web/**"
      - ".github/workflows/web-bench.yml"

jobs:
  web:
    runs-on: windows-latest
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-${{ runner.arch }}-web-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-web-cargo-
            ${{ runner.os }}-${{ runner.arch }}-cargo-

      # the compiler no longer links LLVM (v0.29.0: C-emitting backend); the
      # LLVM install provides the clang driver it compiles with
      - name: Install clang (LLVM toolchain)
        shell: pwsh
        run: |
          winget install --id LLVM.LLVM --accept-source-agreements --accept-package-agreements --silent
          Add-Content $env:GITHUB_PATH "C:\Program Files\LLVM\bin"

      - name: Build compiler
        run: cargo build --release

      - name: Build Aoxn web server
        shell: bash
        run: cargo run --release -- build web\server_win.ax -o web\server.exe -l ws2_32

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Functional parity tests
        shell: bash
        run: node web/loadtest/parity.mjs web\server.exe

      - name: Build Next.js comparison app
        working-directory: web/next-app
        shell: bash
        run: |
          corepack enable
          pnpm install --frozen-lockfile
          pnpm build

      - name: Install oha (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force web/loadtest/tools | Out-Null
          Invoke-WebRequest https://github.com/hatoo/oha/releases/download/v1.16.0/oha-windows-amd64-pgo.exe -OutFile web/loadtest/tools/oha.exe

      - name: Reference benchmark
        shell: bash
        env:
          BENCH_TRIALS: "1"
          BENCH_DURATION: "5s"
        run: |
          netstat -ano | findstr ":3000" || true
          node web/loadtest/bench.mjs

      - name: Upload raw results
        uses: actions/upload-artifact@v4
        with:
          name: web-bench
          path: web/loadtest/last-results.json
