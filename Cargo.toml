[package]
name = "aoxn"
version = "0.27.0"
edition = "2021"
description = "Axon: AI-native compiled programming language"
build = "build.rs"

[[bin]]
name = "aoxn"
path = "src/main.rs"

[lib]
name = "aoxn"
path = "src/lib.rs"

[profile.dev]
opt-level = 1

[profile.release]
opt-level = 3
lto = true


