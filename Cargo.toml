[workspace]
members = ["crates/aoxn-pkg"]
resolver = "2"

[package]
name = "aoxn"
version = "0.29.1"
edition = "2021"
description = "Aoxn: AI-native compiled programming language"

# the compiler lib itself (src/) uses no external crates; this dependency is
# linked for the `aoxn` binary only (pkg-management subcommands live in the
# separate aoxn-pkg crate)
[dependencies]
aoxn-pkg = { path = "crates/aoxn-pkg" }

[[bin]]
name = "aoxn"
path = "src/main.rs"

[lib]
name = "aoxn"
path = "src/lib.rs"

[profile.dev]
opt-level = 1

[profile.release]
opt-level = 3
lto = true
